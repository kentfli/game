<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гонка</title>
<style>
:root{color-scheme:light dark;--bg:#e8ecf1;--ink:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--ink:#eee}}
:root[data-theme="dark"]{--bg:#0e1116;--ink:#eee}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;justify-content:center;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif}
canvas{width:min(100%,480px);height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const W = 360;          // ширина игрового мира (высота подстраивается под экран)
let H = 640;

function resize() {
  H = Math.round(W * cv.clientHeight / cv.clientWidth);
  cv.width = W;
  cv.height = H;
}
addEventListener('resize', resize);
resize();

// ---------- Настройки ----------
const ROAD_X = 30, LANE_W = 100;            // дорога: 3 полосы по 100
const laneX = i => ROAD_X + LANE_W * i + LANE_W / 2;
const CAR_W = 46, CAR_H = 78;
const COLORS = ['#f5c542', '#4ab3f4', '#9b6bff', '#2ec4a6', '#ff8a3d'];

// ---------- Состояние игры ----------
let state = 'menu';                          // menu | play | over
let lane, px, enemies, speed, offset, dist, spawnT, overT;
let best = 0;
try { best = +localStorage.getItem('best') || 0; } catch (e) {}

function reset() {
  lane = 1; px = laneX(1);
  enemies = []; speed = 240; offset = 0; dist = 0; spawnT = 0.5; overT = 0;
}
reset();

// ---------- Управление ----------
function move(dir) {
  lane = Math.max(0, Math.min(2, lane + dir));
}
function startOrMove(dir) {
  if (state === 'menu') { reset(); state = 'play'; }
  else if (state === 'over') { if (overT > 0.5) { reset(); state = 'play'; } }
  else move(dir);
}
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  startOrMove(e.clientX - r.left < r.width / 2 ? -1 : 1);
});
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') startOrMove(-1);
  else if (e.key === 'ArrowRight' || e.key === 'd') startOrMove(1);
  else if (e.key === ' ' || e.key === 'Enter') startOrMove(0);
});

// ---------- Логика ----------
function spawn() {
  const first = Math.floor(Math.random() * 3);
  enemies.push({ lane: first, y: -CAR_H, v: 90 + Math.random() * 70, c: COLORS[Math.floor(Math.random() * COLORS.length)] });
  if (Math.random() < 0.3) {                 // иногда вторая машина, но одна полоса всегда свободна
    let second = (first + 1 + Math.floor(Math.random() * 2)) % 3;
    enemies.push({ lane: second, y: -CAR_H, v: 90 + Math.random() * 70, c: COLORS[Math.floor(Math.random() * COLORS.length)] });
  }
  spawnT = (230 + Math.random() * 150) / speed;
}

function crash() {
  state = 'over'; overT = 0;
  const score = Math.floor(dist);
  if (score > best) {
    best = score;
    try { localStorage.setItem('best', best); } catch (e) {}
  }
  try { navigator.vibrate && navigator.vibrate(200); } catch (e) {}
}

function update(dt) {
  px += (laneX(lane) - px) * Math.min(1, dt * 12);   // плавный переезд
  if (state === 'over') { overT += dt; return; }
  if (state !== 'play') { offset += 120 * dt; return; }

  speed = Math.min(700, speed + 8 * dt);
  offset += speed * dt;
  dist += speed * dt / 10;

  spawnT -= dt;
  if (spawnT <= 0) spawn();

  const py = H - 130;
  for (const e of enemies) {
    e.y += (speed - e.v) * dt;
    if (Math.abs(laneX(e.lane) - px) < CAR_W - 6 && Math.abs(e.y - py) < CAR_H - 8) crash();
  }
  enemies = enemies.filter(e => e.y < H + 100);
}

// ---------- Рисование ----------
function car(x, y, color) {
  g.fillStyle = color;
  g.beginPath(); g.roundRect(x - CAR_W / 2, y - CAR_H / 2, CAR_W, CAR_H, 10); g.fill();
  g.fillStyle = 'rgba(0,0,0,.45)';
  g.fillRect(x - CAR_W / 2 + 7, y - CAR_H / 2 + 14, CAR_W - 14, 16);   // лобовое
  g.fillRect(x - CAR_W / 2 + 7, y + CAR_H / 2 - 24, CAR_W - 14, 10);   // заднее
  g.fillStyle = '#111';
  for (const sx of [-1, 1]) for (const sy of [-1, 1])
    g.fillRect(x + sx * (CAR_W / 2) - (sx > 0 ? 0 : 5), y + sy * 22 - 8, 5, 16);
}

function text(t, x, y, size, color = '#fff', align = 'center') {
  g.fillStyle = color; g.textAlign = align;
  g.font = `bold ${size}px system-ui, sans-serif`;
  g.fillText(t, x, y);
}

function draw() {
  g.fillStyle = '#2f7d32'; g.fillRect(0, 0, W, H);                 // трава
  g.fillStyle = '#3a3f47'; g.fillRect(ROAD_X, 0, LANE_W * 3, H);   // дорога
  g.fillStyle = '#fff';
  g.fillRect(ROAD_X - 4, 0, 4, H); g.fillRect(ROAD_X + LANE_W * 3, 0, 4, H);

  g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 4;
  g.setLineDash([34, 30]); g.lineDashOffset = -offset;
  for (let i = 1; i < 3; i++) {
    g.beginPath(); g.moveTo(ROAD_X + LANE_W * i, 0); g.lineTo(ROAD_X + LANE_W * i, H); g.stroke();
  }
  g.setLineDash([]);

  for (const e of enemies) car(laneX(e.lane), e.y, e.c);
  car(px, H - 130, '#e53935');

  // табло
  text('Очки: ' + Math.floor(dist), 14, 30, 20, '#fff', 'left');
  text('Рекорд: ' + best, W - 14, 30, 16, '#ffd54f', 'right');
  text(Math.round(speed / 3) + ' км/ч', 14, 54, 14, '#cfd8dc', 'left');

  if (state !== 'play') {
    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, 0, W, H);
    if (state === 'menu') {
      text('🏎️ ГОНКА', W / 2, H / 2 - 50, 40);
      text('Тап слева: влево', W / 2, H / 2, 18, '#cfd8dc');
      text('Тап справа: вправо', W / 2, H / 2 + 28, 18, '#cfd8dc');
      text('Тапни, чтобы начать', W / 2, H / 2 + 80, 22, '#ffd54f');
    } else {
      text('Авария!', W / 2, H / 2 - 50, 40, '#ff5252');
      text('Очки: ' + Math.floor(dist), W / 2, H / 2, 24);
      text('Рекорд: ' + best, W / 2, H / 2 + 32, 18, '#ffd54f');
      if (overT > 0.5) text('Тапни, чтобы ехать снова', W / 2, H / 2 + 86, 20);
    }
  }
}

// ---------- Главный цикл ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
